services:
  db:
    image: postgres:18
    container_name: securities-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: projectdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d projectdb"]
      interval: 5s
      timeout: 5s
      retries: 10  

  backend:
    build: ./backend
    container_name: securities-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/projectdb
      - SPRING_DATASOURCE_USERNAME=devuser
      - SPRING_DATASOURCE_PASSWORD=devpass
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: