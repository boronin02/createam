spring:
  application:
    name: securities-app
  datasource:
    url: jdbc:postgresql://localhost:5433/projectdb
    username: devuser
    password: devpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

logging:
  level:
    org.flywaydb: INFO

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970 # Просто случайный набор символов в hex
  expiration: 86400000 # Время жизни токена (24 часа в миллисекундах)